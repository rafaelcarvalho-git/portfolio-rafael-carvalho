<section id="experience" class="experience section">
  <div class="container narrow">
    <h2 class="section-heading">
      Professional <span class="accent">Experience</span>
      <span class="rule"></span>
    </h2>
    <ol class="timeline" id="timeline">
      @for (exp of experiences; track exp.company) {
        <li class="timeline-item">
          <div class="tl-head">
            <h3>
              {{ exp.role }} <span class="at">@ {{ exp.company }}</span>
            </h3>
            <span class="tl-period">{{ exp.period }}</span>
          </div>
          <ul class="tl-bullets">
            @for (bullet of exp.bullets; track $index) {
              <li>{{ bullet }}</li>
            }
          </ul>
        </li>
      }
    </ol>
  </div>
</section>
